<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SMART VISION | لوحة الإدارة</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>:root{--bg:#000;--rich:#0A0A0A;--gold:#D4AF37;--glow:#FFD54A;--bd:#C9A227;--ga:rgba(212,175,55,.25);--mut:#8F8F8F;--sec:#CFCFCF;--grad:linear-gradient(90deg,#8B6B15,#D4AF37,#FFD54A,#D4AF37,#8B6B15)}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100dvh}a{color:var(--gold);text-decoration:none}.brand{font-weight:900;letter-spacing:3px}.brand span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}input,select,textarea{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);padding:13px 15px;border-radius:8px;color:#fff;font:inherit;outline:0;margin-bottom:14px}input:focus,select:focus,textarea:focus{border-color:var(--gold)}select option{background:#0a0a0a}label{display:block;color:var(--gold);font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}.btn{background:var(--grad);color:#000;border:0;border-radius:8px;padding:13px 22px;font:700 .8rem Inter,sans-serif;letter-spacing:1.5px;cursor:pointer}.btn.o{background:none;border:1px solid var(--bd);color:var(--gold)}.btn.d{background:none;border:1px solid #a33;color:#ff8a80;padding:7px 12px}.btn:disabled{opacity:.6}
body{font-family:Cairo,Inter,sans-serif;background:var(--rich)}header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#000;border-bottom:1px solid var(--ga);position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap}.who{font-size:.8rem;color:var(--mut)}
nav{display:flex;gap:8px;padding:18px 28px 0;flex-wrap:wrap}nav button{background:none;border:1px solid var(--ga);color:var(--sec);padding:10px 20px;border-radius:30px;cursor:pointer;font:600 .85rem Cairo,sans-serif}nav button.on{background:var(--grad);color:#000;border-color:transparent}
main{padding:22px 28px 60px;max-width:1100px;margin:0 auto}.panel{display:none}.panel.on{display:block}.box{background:rgba(255,255,255,.03);border:1px solid var(--ga);border-radius:14px;padding:24px;margin-bottom:22px}.box h3{margin-bottom:16px;color:var(--gold);font-size:1rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{min-height:110px;resize:vertical}
.it{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.it:last-child{border:0}.it img{width:84px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--ga)}.it .t{flex:1;min-width:0}.it h4{font-size:.95rem;margin-bottom:4px}.it small{color:var(--mut);display:block;font-size:.75rem}.it p{font-size:.85rem;color:var(--sec);margin-top:6px;white-space:pre-wrap;word-break:break-word}.it select{width:auto;margin:0;padding:7px 10px;font-size:.8rem}
.pill{font-size:.68rem;padding:3px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--gold);margin-inline-start:6px}.empty{color:var(--mut);text-align:center;padding:26px}.tst{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--bd);padding:11px 22px;border-radius:30px;font-size:.85rem;display:none;z-index:9}
@media(max-width:700px){.g2{grid-template-columns:1fr}main,nav,header{padding-inline:16px}}</style></head>
<body><header><div class="brand">SMART <span>VISION</span> <small style="font-size:.65rem;color:var(--mut);letter-spacing:2px">· لوحة الإدارة</small></div><div><span class="who" id="who"></span> <button class="btn o" id="out" style="padding:8px 16px">خروج</button></div></header>
<nav id="tabs"><button data-t="rq" class="on"><i class="fa-solid fa-inbox"></i> الطلبات</button><button data-t="nw" data-a><i class="fa-solid fa-newspaper"></i> الأخبار</button><button data-t="pj" data-a><i class="fa-solid fa-city"></i> المشاريع</button><button data-t="ad" data-a><i class="fa-solid fa-user-shield"></i> المدراء والموظفون</button></nav>
<main>
<section class="panel on" id="p-rq"><div class="box"><h3>الطلبات الواردة</h3><div id="l-rq"></div></div></section>
<section class="panel" id="p-nw"><div class="box"><h3>نشر خبر جديد</h3><form id="f-nw"><div class="g2"><div><label>العنوان</label><input name="title" required></div><div><label>التصنيف</label><input name="category" placeholder="Project Milestone"></div></div><label>نص الخبر (فقرة لكل سطر)</label><textarea name="body" required></textarea><label>الصورة</label><input type="file" name="img" accept="image/*" required><button class="btn">نشر الخبر</button></form></div><div class="box"><h3>الأخبار المنشورة</h3><div id="l-nw"></div></div></section>
<section class="panel" id="p-pj"><div class="box"><h3>نشر مشروع جديد</h3><form id="f-pj"><div class="g2"><div><label>اسم المشروع</label><input name="title" required></div><div><label>القطاع</label><select name="category"><option>Architecture</option><option>Structure</option><option>MEP</option><option>Site Supervision</option></select></div></div><label>وصف مختصر</label><textarea name="description"></textarea><label>الصورة</label><input type="file" name="img" accept="image/*" required><button class="btn">نشر المشروع</button></form></div><div class="box"><h3>المشاريع المنشورة</h3><div id="l-pj"></div></div></section>
<section class="panel" id="p-ad"><div class="box"><h3>إيميلات الأدمن (تستقبل الطلبات وتملك صلاحية الإدارة)</h3><form id="f-ad" class="g2" style="align-items:end"><div><label>بريد إلكتروني جديد</label><input name="email" type="email" required></div><div><button class="btn" style="margin-bottom:14px">إضافة</button></div></form><div id="l-ad"></div></div>
<div class="box"><h3>حسابات الدخول</h3><p style="font-size:.8rem;color:var(--mut);margin-bottom:10px">أنشئ حساب الموظف من Supabase ← Authentication ← Invite user، ثم فعّله هنا.</p><div id="l-us"></div></div></section>
</main><div class="tst" id="tst"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/sv-config.js"></script>
<script>
var C=window.SV,sb=supabase.createClient(C.url,C.key),$=function(i){return document.getElementById(i)},me,isAdmin=false;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function toast(t){var e=$('tst');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2600)}
var ST={new:'جديد',in_progress:'قيد المتابعة',done:'تم'},KD={contact:'استفسار',consultation:'استشارة',quote:'عرض سعر',partnership:'شراكة',career:'وظيفة'};
async function init(){var u=(await sb.auth.getUser()).data.user;if(!u)return location.href='staff-login.html';
  var p=(await sb.from('profiles').select('role').eq('id',u.id).maybeSingle()).data;
  if(!p||p.role==='pending'){await sb.auth.signOut();return location.href='staff-login.html'}
  me=u;isAdmin=p.role==='admin';$('who').textContent=u.email+(isAdmin?' · مدير':' · موظف');
  document.querySelectorAll('[data-a]').forEach(function(b){b.style.display=isAdmin?'':'none'});loadAll()}
function loadAll(){reqs();if(isAdmin){list('news','l-nw');list('projects','l-pj');admins()}}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#tabs button,.panel').forEach(function(x){x.classList.remove('on')});b.classList.add('on');$('p-'+b.dataset.t).classList.add('on')}});
$('out').onclick=async function(){await sb.auth.signOut();location.href='staff-login.html'};
async function reqs(){var r=await sb.from('requests').select('*').order('created_at',{ascending:false}).limit(200),d=r.data||[];
  $('l-rq').innerHTML=d.length?d.map(function(x){return '<div class="it"><div class="t"><h4>'+esc(x.name)+'<span class="pill">'+(KD[x.kind]||esc(x.kind))+'</span></h4><small>'+esc(x.email)+' · '+esc(x.phone)+' · '+new Date(x.created_at).toLocaleString('ar-EG')+'</small>'+(x.subject?'<small><b>'+esc(x.subject)+'</b></small>':'')+'<p>'+esc(x.message)+'</p></div><div style="display:flex;flex-direction:column;gap:8px"><select data-id="'+x.id+'" class="st">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(k===x.status?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select>'+(isAdmin?'<button class="btn d" data-del="requests:'+x.id+'">حذف</button>':'')+'</div></div>'}).join(''):'<div class="empty">لا توجد طلبات بعد</div>'}
async function list(t,el){var d=(await sb.from(t).select('*').order('created_at',{ascending:false})).data||[];
  $(el).innerHTML=d.length?d.map(function(x){return '<div class="it"><img src="'+esc(x.image_url)+'" alt=""><div class="t"><h4>'+esc(x.title)+'<span class="pill">'+esc(x.category||'')+'</span></h4><small>'+new Date(x.created_at).toLocaleDateString('ar-EG')+(x.published?'':' · مخفي')+'</small><p>'+esc((x.body||x.description||'').slice(0,140))+'</p></div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn o" style="padding:7px 12px" data-pub="'+t+':'+x.id+':'+x.published+'">'+(x.published?'إخفاء':'إظهار')+'</button><button class="btn d" data-del="'+t+':'+x.id+'">حذف</button></div></div>'}).join(''):'<div class="empty">لا يوجد محتوى بعد</div>'}
async function admins(){var a=(await sb.from('admin_emails').select('*').order('created_at')).data||[],u=(await sb.from('profiles').select('*').order('created_at')).data||[];
  $('l-ad').innerHTML=a.map(function(x){return '<div class="it" style="align-items:center"><div class="t"><h4>'+esc(x.email)+'</h4></div><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto;margin:0" data-nt="'+esc(x.email)+'"'+(x.notify?' checked':'')+'> يستقبل الطلبات</label><button class="btn d" data-del="admin_emails:'+esc(x.email)+'">حذف</button></div>'}).join('')||'<div class="empty">لا يوجد</div>';
  $('l-us').innerHTML=u.map(function(x){return '<div class="it" style="align-items:center"><div class="t"><h4>'+esc(x.email)+'</h4></div><select data-role="'+x.id+'"'+(x.id===me.id?' disabled':'')+'>'+[['admin','مدير'],['staff','موظف'],['pending','معلّق']].map(function(r){return '<option value="'+r[0]+'"'+(r[0]===x.role?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select></div>'}).join('')||'<div class="empty">لا يوجد</div>'}
document.addEventListener('change',async function(e){var t=e.target;
  if(t.classList.contains('st')){await sb.from('requests').update({status:t.value}).eq('id',t.dataset.id);toast('تم التحديث')}
  if(t.dataset.role){await sb.from('profiles').update({role:t.value}).eq('id',t.dataset.role);toast('تم تحديث الصلاحية')}
  if(t.dataset.nt){await sb.from('admin_emails').update({notify:t.checked}).eq('email',t.dataset.nt);toast('تم الحفظ')}});
document.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.del){if(!confirm('تأكيد الحذف؟'))return;var p=b.dataset.del.split(':'),col=p[0]==='admin_emails'?'email':'id';await sb.from(p[0]).delete().eq(col,p[1]);toast('تم الحذف');loadAll()}
  if(b.dataset.pub){var q=b.dataset.pub.split(':');await sb.from(q[0]).update({published:q[2]!=='true'}).eq('id',q[1]);loadAll()}});
async function up(file){var n=Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from('media').upload(n,file,{cacheControl:'31536000'});if(r.error)throw r.error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl}
function pub(id,t,map){$(id).onsubmit=async function(e){e.preventDefault();var f=e.target,btn=f.querySelector('.btn');btn.disabled=true;
  try{var d=new FormData(f),row=map(d);row.image_url=await up(d.get('img'));var r=await sb.from(t).insert(row);if(r.error)throw r.error;f.reset();toast('تم النشر ✓');loadAll()}catch(x){toast('خطأ: '+(x.message||x))}btn.disabled=false}}
pub('f-nw','news',function(d){return{title:d.get('title'),category:d.get('category'),body:d.get('body')}});
pub('f-pj','projects',function(d){return{title:d.get('title'),category:d.get('category'),description:d.get('description')}});
$('f-ad').onsubmit=async function(e){e.preventDefault();var m=new FormData(e.target).get('email').trim().toLowerCase();
  var r=await sb.from('admin_emails').insert({email:m});if(r.error)return toast('خطأ: '+r.error.message);
  await sb.from('profiles').update({role:'admin'}).eq('email',m);e.target.reset();toast('تمت الإضافة');admins()};
init();
</script></body></html>
